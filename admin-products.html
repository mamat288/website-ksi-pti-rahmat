<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Produk - DENIMVERSE ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        body { background-color: #0d1117; color: #e4e6eb; font-family: sans-serif; }
        .admin-cta { background-color: #e53e3e; transition: background-color 0.3s; }
        .admin-cta:hover { background-color: #c53030; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #1a202c; }
        th { background-color: #1a202c; }
        tr:hover { background-color: #1a202c; }
    </style>
</head>
<body class="min-h-screen">
    <header class="bg-gray-900 p-4 border-b border-red-500/50 flex justify-between items-center">
        <a href="admin-dashboard.html" class="text-xl font-bold text-red-400 hover:text-red-300">ADMIN PANEL</a>
        <button onclick="window.location.href='admin-login.html';" class="admin-cta px-4 py-2 text-sm rounded-lg font-semibold">
            Logout
        </button>
    </header>

    <main class="p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-semibold">Kelola Produk</h2>
            <button class="admin-cta px-4 py-2 rounded-lg font-semibold">+ Tambah Produk Baru</button>
        </div>
        <p class="text-gray-400 mb-8">Daftar semua produk yang tersedia. Stok dan Harga.</p>

        <div class="bg-gray-800 rounded-lg shadow-xl overflow-x-auto">
            <table class="min-w-full text-sm">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Produk</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th>Fit/Potongan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="text-gray-300">
                        <td>DNMV001</td>
                        <td>The Midnight Raw</td>
                        <td>Rp 899.000</td>
                        <td>85</td>
                        <td>Slim Fit</td>
                        <td><button onclick="window.location.href='product-detail.html';" class="text-indigo-400 hover:text-indigo-300">Edit</button></td>
                    </tr>
                    <tr class="text-gray-300">
                        <td>DNMV002</td>
                        <td>The Coastal Fade</td>
                        <td>Rp 750.000</td>
                        <td>120</td>
                        <td>Tapered Fit</td>
                        <td><button onclick="window.location.href='product-detail.html';" class="text-indigo-400 hover:text-indigo-300">Edit</button></td>
                    </tr>
                    <tr class="text-gray-300">
                        <td>DNMV003</td>
                        <td>The Shadow Line</td>
                        <td>Rp 850.000</td>
                        <td>45</td>
                        <td>Straight Fit</td>
                        <td><button onclick="window.location.href='product-detail.html';" class="text-indigo-400 hover:text-indigo-300">Edit</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
