<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - DENIMVERSE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #0d1117; color: #e4e6eb; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .denim-cta { background-color: #2b6cb0; transition: background-color 0.3s; }
        .denim-cta:hover { background-color: #3182ce; }
        .input-style { padding: 0.75rem; background-color: #1a202c; color: white; border: 1px solid #4a5568; border-radius: 0.5rem; width: 100%; transition: border-color 0.3s; }
        .input-style:focus { border-color: #4c51bf; outline: none; box-shadow: 0 0 0 3px rgba(76, 81, 191, 0.5); }
    </style>
</head>
<body>

<div class="w-full max-w-md p-8 bg-gray-900 rounded-xl shadow-2xl border border-gray-800">
    <div class="text-center mb-8">
        <a href="index.html" class="text-3xl font-bold tracking-wider text-indigo-400 hover:text-indigo-300 transition">DENIMVERSE</a>
        <p class="text-gray-400 mt-2" id="form-title">Masuk ke Akun Anda</p>
    </div>

    <form id="login-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="mb-4">
            <label for="login-email" class="block text-sm font-medium mb-1">Email</label>
            <input type="email" id="login-email" class="input-style" placeholder="email@contoh.com" required>
        </div>
        <div class="mb-6">
            <label for="login-password" class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="login-password" class="input-style" placeholder="********" required>
        </div>
        
        <button type="submit" class="denim-cta w-full py-3 font-semibold rounded-lg shadow-lg mb-4">
            Masuk
        </button>
        
        <p class="text-center text-sm text-gray-500 mb-4">-- atau --</p>
        
        <button type="button" class="w-full py-2 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg mb-3 transition">
            Masuk dengan Google
        </button>
        <button type="button" class="w-full py-2 bg-blue-700 hover:bg-blue-800 text-white font-medium rounded-lg transition">
            Masuk dengan Facebook
        </button>

        <p class="text-center text-sm mt-6">
            Belum punya akun? <a href="#" id="toggle-register" class="text-indigo-400 hover:text-indigo-300 font-medium">Daftar Sekarang</a>
        </p>
    </form>

    <form id="register-form" class="hidden" onsubmit="event.preventDefault(); alert('Registrasi berhasil! Anda akan diarahkan ke login.'); showForm('login');">
        <div class="mb-4">
            <label for="reg-name" class="block text-sm font-medium mb-1">Nama Lengkap</label>
            <input type="text" id="reg-name" class="input-style" required>
        </div>
        <div class="mb-4">
            <label for="reg-email" class="block text-sm font-medium mb-1">Email</label>
            <input type="email" id="reg-email" class="input-style" required>
        </div>
        <div class="mb-6">
            <label for="reg-password" class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="reg-password" class="input-style" placeholder="Minimal 6 karakter" required>
        </div>
        
        <button type="submit" class="denim-cta w-full py-3 font-semibold rounded-lg shadow-lg mb-4">
            Daftar Akun Baru
        </button>

        <p class="text-center text-sm mt-6">
            Sudah punya akun? <a href="#" id="toggle-login" class="text-indigo-400 hover:text-indigo-300 font-medium">Masuk</a>
        </p>
    </form>
</div>

<script>
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const toggleRegister = document.getElementById('toggle-register');
    const toggleLogin = document.getElementById('toggle-login');
    const formTitle = document.getElementById('form-title');

    function showForm(formToShow) {
        if (formToShow === 'register') {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            formTitle.textContent = 'Buat Akun Baru';
        } else {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            formTitle.textContent = 'Masuk ke Akun Anda';
        }
    }

    toggleRegister.addEventListener('click', (e) => {
        e.preventDefault();
        showForm('register');
    });

    toggleLogin.addEventListener('click', (e) => {
        e.preventDefault();
        showForm('login');
    });
</script>

</body>
</html>
